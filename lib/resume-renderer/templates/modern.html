<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - {{name}}</title>
    <link rel="stylesheet" href="../styles/base.css">
    <style>
        /* Modern Theme Specifics */
        .resume-header {
            border-left: 4px solid var(--accent-color);
            padding-left: 20px;
            margin-bottom: 30px;
        }

        .name {
            font-size: 38px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary-color);
            font-weight: 800;
        }

        .title {
            color: var(--accent-color);
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .section-title {
            border-bottom: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding-bottom: 6px;
        }
    </style>
</head>

<body>
    <div class="resume-container modern-layout">
        <!-- Sidebar (Left) -->
        <aside class="sidebar">
            <!-- Contact Info -->
            <div class="contact-section">
                {{modern_contact_html}}
            </div>

            <!-- Education -->
            <div class="sidebar-section">
                <h2 class="sidebar-title">Education</h2>
                <div class="education-list">
                    {{education_html}}
                </div>
            </div>

            <!-- Skills -->
            <div class="sidebar-section">
                <h2 class="sidebar-title">Skills</h2>
                <div class="skills-list">
                    {{skills_html}}
                </div>
            </div>
        </aside>

        <!-- Main Content (Right) -->
        <main class="main-content">
            <!-- Header -->
            <header class="resume-header">
                <h1 class="name">{{name}}</h1>
                <p class="rolename">{{current_role}}</p>
            </header>

            <!-- Summary -->
            <section class="section">
                <p class="summary-text">{{summary}}</p>
            </section>

            <!-- Experience -->
            <section class="section">
                <div class="section-heading">
                    <h2 class="section-title">Experience</h2>
                    <div class="divider"></div>
                </div>
                <div class="experience-list">
                    {{experience_html}}
                </div>
            </section>
        </main>
    </div>

    <style>
        /* Modern Theme Overrides */
        body {
            background: white;
            font-family: var(--body-font), sans-serif;
            color: #1e293b;
            /* slate-800 */
        }

        .resume-container.modern-layout {
            display: flex;
            flex-direction: row;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            max-width: 100%;
        }

        /* SIDEBAR (32% width) */
        .sidebar {
            width: 32%;
            background-color: var(--primary-color);
            color: white;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            margin-bottom: 1rem;
        }

        .contact-item .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.5;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .contact-item .value {
            font-size: 14px;
            font-weight: 500;
            opacity: 0.9;
            color: inherit;
            text-decoration: none;
            word-break: break-all;
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.5;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            padding: 3rem 2.5rem;
            background: white;
        }

        .resume-header {
            margin-bottom: 2.5rem;
            border-left: none;
            /* Reset generic override */
            padding-left: 0;
        }

        .name {
            font-size: 48px;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            color: var(--primary-color);
            font-weight: 800;
            margin: 0 0 10px 0;
        }

        .rolename {
            font-size: 20px;
            color: var(--accent-color);
            font-weight: 500;
            letter-spacing: 0.05em;
            margin: 0;
        }

        .summary-text {
            font-size: 14px;
            line-height: 1.6;
            color: #475569;
            /* slate-600 */
            margin-bottom: 2.5rem;
        }

        .section-heading {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
            color: #94a3b8;
            /* slate-400 */
            margin: 0;
            border: none;
            padding: 0;
            white-space: nowrap;
        }

        .action-divider {
            flex: 1;
            height: 1px;
            background: #e2e8f0;
            /* slate-200 */
        }

        /* EXPERIENCE & EDUCATION ITEMS */
        .job-item {
            position: relative;
            padding-left: 1.5rem;
            border-left: 2px solid var(--accent-color);
            margin-bottom: 2.5rem;
        }

        /* Timeline Dot */
        .job-item::before {
            content: '';
            position: absolute;
            left: -5px;
            /* - (width/2 + border-width) */
            top: 6px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-color);
            border: 2px solid white;
            /* Ring effect */
            box-shadow: 0 0 0 2px white;
            /* Extra spacing if needed */
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.5rem;
        }

        /* Override default job header flex/layout if needed */
        .job-role {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            /* slate-900 */
        }

        .separator {
            display: none;
        }

        /* Hide 'at' separator, standard expects it but modern might stack */

        .job-company {
            display: block;
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary-color);
            opacity: 0.8;
            margin-bottom: 0.75rem;
        }

        .job-date {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            /* slate-500 */
        }

        .job-description li {
            font-size: 14px;
            line-height: 1.6;
            color: #475569;
            margin-bottom: 0.5rem;
        }

        /* SIDEBAR LISTS (Education/Skills) need specific styling override */
        .sidebar .education-item {
            margin-bottom: 1.5rem;
        }

        .sidebar .degree {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-color);
            /* Per React design */
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .sidebar .institution {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }

        .sidebar .job-date {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            display: block;
            margin-top: 4px;
        }

        /* Hide default education header layout for sidebar context */
        .sidebar .job-header {
            display: block;
        }

        .sidebar .skill-tag {
            display: inline-block;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin: 0 4px 4px 0;
        }

        /* UTILS */
        @media print {
            body {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .sidebar {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                background-color: var(--primary-color) !important;
            }
        }
    </style>
</body>

</html>
